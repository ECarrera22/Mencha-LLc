  <main>
    <section>
      <h2>Contacto / Contact</h2>
      <form id="contact-form" action="mailto:contact@menchagc.com" method="POST" enctype="text/plain">
        <label for="name">Nombre / Name:</label><br />
        <input type="text" id="name" name="name" required /><br />

        <label for="email">Correo Electrónico / Email:</label><br />
        <input type="email" id="email" name="email" required /><br />

        <label for="message">Mensaje / Message:</label><br />
        <textarea id="message" name="message" rows="5" required></textarea><br />

        <button type="submit">Enviar / Send</button>
      </form>
    </section>
  </main>
